apiVersion: v1
kind: Service
metadata:
  name: reservas-frontend
  namespace: seminario-lab
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app: reservas-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservas-frontend
  namespace: seminario-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reservas-frontend
  template:
    metadata:
      labels:
        app: reservas-frontend
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: API_UPSTREAM
          value: reservas-api:80
        image: registry.invalid/seminario/reservas-frontend:s18
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
        name: frontend
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 2
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - emptyDir:
          sizeLimit: 32Mi
        name: tmp
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: reservas-frontend
  namespace: seminario-lab
spec:
  port:
    targetPort: http
  tls:
    insecureEdgeTerminationPolicy: Redirect
    termination: edge
  to:
    kind: Service
    name: reservas-frontend
