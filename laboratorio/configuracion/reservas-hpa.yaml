# Aplicar solo con metrics.k8s.io disponible y requests de CPU definidos.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: reservas-api
  namespace: seminario
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: reservas-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
