apiVersion: v1
kind: Namespace
metadata:
  name: seminario
  labels:
    app.kubernetes.io/part-of: seminario
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: comprobacion-html
  namespace: seminario
data:
  index.html: |
    <!doctype html>
    <html lang="es">
    <meta charset="utf-8">
    <title>Comprobacion del laboratorio</title>
    <h1>SEMINARIO-OK</h1>
    <p>Kubernetes sirve la pagina de comprobacion.</p>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comprobacion
  namespace: seminario
spec:
  replicas: 2
  selector:
    matchLabels:
      app: comprobacion
  template:
    metadata:
      labels:
        app: comprobacion
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: comprobacion
      containers:
        - name: web
          # Resolver a digest antes de afirmar reproducibilidad.
          image: nginxinc/nginx-unprivileged:stable-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: html
          configMap:
            name: comprobacion-html
        - name: temporary
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: comprobacion
  namespace: seminario
spec:
  type: ClusterIP
  selector:
    app: comprobacion
  ports:
    - name: http
      port: 80
      targetPort: http
