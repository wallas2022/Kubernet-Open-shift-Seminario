# Plantilla offline. Resolver antes de aplicar; no validada en un cluster.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: reservas-api
  namespace: PROJECT_REQUIRED
spec:
  to:
    kind: Service
    name: reservas-api
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
