# Plantilla offline. Resolver antes de aplicar; no validada en un cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservas-api
  namespace: PROJECT_REQUIRED
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reservas-api
  template:
    metadata:
      labels:
        app: reservas-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: reservas-api
      containers:
      - name: api
        image: IMAGE_BY_DIGEST_REQUIRED
        imagePullPolicy: IfNotPresent
        envFrom:
        - secretRef:
            name: reservas-config
        env:
        - name: POOL_MAX
          value: '10'
        - name: DB_SCHEMA
          value: public
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        ports:
        - name: http
          containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 5
          failureThreshold: 24
        volumeMounts:
        - name: db-ca
          mountPath: /etc/reservas-db
          readOnly: true
        - name: tmp
          mountPath: /tmp
      serviceAccountName: reservas-run
      volumes:
      - name: db-ca
        secret:
          secretName: reservas-db-ca
          defaultMode: 292
      - name: tmp
        emptyDir:
          sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: reservas-api
  namespace: PROJECT_REQUIRED
spec:
  selector:
    app: reservas-api
  ports:
  - port: 80
    targetPort: http
    name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservas-worker
  namespace: PROJECT_REQUIRED
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reservas-worker
  template:
    metadata:
      labels:
        app: reservas-worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: worker
        image: IMAGE_BY_DIGEST_REQUIRED
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - reservas.worker
        envFrom:
        - secretRef:
            name: reservas-config
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: db-ca
          mountPath: /etc/reservas-db
          readOnly: true
        - name: tmp
          mountPath: /tmp
        env:
        - name: DB_SCHEMA
          value: public
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
      serviceAccountName: reservas-run
      volumes:
      - name: db-ca
        secret:
          secretName: reservas-db-ca
          defaultMode: 292
      - name: tmp
        emptyDir:
          sizeLimit: 32Mi
