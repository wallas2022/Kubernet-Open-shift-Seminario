# Laboratorio kind. PostgreSQL es una instancia unica; no ofrece HA de datos.
apiVersion: v1
kind: Namespace
metadata:
  name: seminario
---
apiVersion: v1
kind: Service
metadata:
  name: reservas-db
  namespace: seminario
spec:
  clusterIP: None
  selector:
    app: reservas-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: reservas-db
  namespace: seminario
spec:
  serviceName: reservas-db
  replicas: 1
  selector:
    matchLabels:
      app: reservas-db
  template:
    metadata:
      labels:
        app: reservas-db
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsGroup: 999
      containers:
        - name: postgres
          image: postgres:18
          env:
            - name: POSTGRES_DB
              value: reservas
            - name: POSTGRES_USER
              value: seminario
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reservas-config
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "seminario", "-d", "reservas"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: reservas-init
  namespace: seminario
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: seminario-reservas:1.0.0
          imagePullPolicy: Never
          command: ["python", "-m", "reservas.manage", "init"]
          envFrom:
            - secretRef:
                name: reservas-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 256Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservas-api
  namespace: seminario
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reservas-api
  template:
    metadata:
      labels:
        app: reservas-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: reservas-api}
      containers:
        - name: api
          image: seminario-reservas:1.0.0
          imagePullPolicy: Never
          envFrom:
            - secretRef:
                name: reservas-config
          env:
            - name: POOL_MAX
              value: "10"
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 5
            failureThreshold: 24
---
apiVersion: v1
kind: Service
metadata:
  name: reservas-api
  namespace: seminario
spec:
  selector:
    app: reservas-api
  ports:
    - port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservas-worker
  namespace: seminario
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reservas-worker
  template:
    metadata:
      labels:
        app: reservas-worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: seminario-reservas:1.0.0
          imagePullPolicy: Never
          command: ["python", "-m", "reservas.worker"]
          envFrom:
            - secretRef:
                name: reservas-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
