name: seminario-s18
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: seminario
      POSTGRES_DB: reservas_s18
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Secretos exclusivos S18 requeridos}
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U seminario -d reservas_s18']
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    image: seminario-reservas-api:s18
    build: ../../aplicacion
    environment: &environment
      DATABASE_URL: postgresql://seminario:${POSTGRES_PASSWORD}@db:5432/reservas_s18
      CLIENT_KEYS_JSON: ${CLIENT_KEYS_JSON:?Secretos exclusivos S18 requeridos}
      POOL_MAX: '10'
    command: [python, -m, reservas.manage, init, --capacity, '25']
    depends_on:
      db: {condition: service_healthy}
  api:
    image: seminario-reservas-api:s18
    pull_policy: never
    environment: *environment
    command: [uvicorn, 'reservas.api:create_app', --factory, --host, 0.0.0.0, --port, '8080', --no-access-log]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/health/ready",timeout=2)']
      interval: 2s
      timeout: 3s
      retries: 30
  frontend:
    image: seminario-reservas-frontend:s18
    build: ..
    user: ${FRONTEND_UID:-1000710000}:0
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m,mode=1777']
    environment:
      API_UPSTREAM: api:8080
    ports: ['127.0.0.1:${FRONTEND_PORT:-18083}:8080']
    depends_on:
      api: {condition: service_healthy}
