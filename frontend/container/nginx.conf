worker_processes 1;
pid /tmp/frontend-nginx.pid;
error_log /dev/null;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    upstream backend { server __API_UPSTREAM__; }
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 16k;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        # Reject URL parameters before any proxy operation; do not log URLs.
        if ($request_uri ~ "\?") { return 400; }
        location = /health/live { access_log off; default_type application/json; return 200 '{"status":"live"}'; }
        location = /health/ready { access_log off; try_files /index.html =503; }
        location = /api { default_type application/json; return 404 '{"error":"resource_not_available"}'; }
        location /api/ {
            proxy_pass http://backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 20s;
            proxy_send_timeout 20s;
            # Never retry a reservation POST automatically.
            proxy_next_upstream off;
            proxy_cache off;
            proxy_intercept_errors on;
            error_page 502 503 504 = @api_unavailable;
        }
        location @api_unavailable { default_type application/json; return 502 '{"error":"api_unavailable"}'; }
        location ~ /\. { return 404; }
        location /assets/ { try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
