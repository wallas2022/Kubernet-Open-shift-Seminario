apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservas-frontend
spec:
  replicas: 1
  selector:
    matchLabels: {app: reservas-frontend}
  template:
    metadata:
      labels: {app: reservas-frontend}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: frontend
          image: seminario-reservas-frontend:s18
          imagePullPolicy: IfNotPresent
          env:
            - {name: API_UPSTREAM, value: 'reservas-api:80'}
          ports:
            - {name: http, containerPort: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          # Initial laboratory budgets; sizing and measurement belong to S19.
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: reservas-frontend
spec:
  selector: {app: reservas-frontend}
  ports:
    - {name: http, port: 80, targetPort: http}
