# Requires an existing Ingress controller, DNS/hosts and TLS Secret.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reservas-frontend
spec:
  ingressClassName: nginx
  tls:
    - hosts: [reservas.lab.test]
      secretName: reservas-lab-tls
  rules:
    - host: reservas.lab.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: reservas-frontend
                port: {name: http}
